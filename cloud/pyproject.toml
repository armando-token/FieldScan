[project]
name = "fieldscan-cloud"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic>=2,<3",
  "httpx",
  "cryptography",
  "numpy",
  "trimesh",
  "pillow",
  "shapely",
  "mapbox-earcut",
]

[project.optional-dependencies]
step = ["cadquery"]

[dependency-groups]
dev = ["pytest"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
